[project]
name = "openverto"
version = "0.2.2"
description = "Python CLI and library for the official IGM Verto Online coordinate transforms between Italian reference systems"
readme = "README.md"
authors = [
    { name = "Andrea Borruso", email = "aborruso@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["igm", "verto", "coordinate", "epsg", "crs", "italy", "rdn2008", "gauss-boaga", "open-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.24.1",
    "rich>=14.0.0",
    "platformdirs>=4.0.0",
    "duckdb>=1.5.3",
]

[project.scripts]
openverto = "openverto:main"

[project.urls]
Homepage = "https://github.com/ondata/openverto"
Issues = "https://github.com/ondata/openverto/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "twine>=5", "build>=1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Skip the live (network) tests by default; run them with: pytest -m live
addopts = "-m 'not live'"
markers = ["live: tests that hit the live IGM Verto Online service"]

[tool.ruff.lint]
ignore = ["E402"]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"
